events {}

http {
    include /etc/nginx/mime.types; # Чтобы стили кнопок загружались корректно

    server {
        listen 80;

        # 1. Раздача нашего HTML-фронтенда на главной странице
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Прокси на Java микросервис задач
        location /tasks {
            proxy_pass http://api:8080;
        }

        # 3. Прокси на Python микросервис уведомлений
        location /notify {
            proxy_pass http://notifications:8000;
        }

        # 4. Прокси на Go микросервис аналитики
        location /analytics {
            proxy_pass http://analytics:9000;
        }
    }
}
