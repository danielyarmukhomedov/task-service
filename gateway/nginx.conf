events {}

http {
    server {
        listen 80;

        # Маршрутизация на Java сервис (Tasks)
        location /tasks {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Маршрутизация на Python сервис (Notifications)
        location /notify {
            proxy_pass http://notifications:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
