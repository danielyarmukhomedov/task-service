version: "3.9"

services:
  # --- API GATEWAY + ВЕБ ИНТЕРФЕЙС ---
  gateway:
    build: ./gateway
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html # Монтируем HTML папку внутрь веб-сервера
    depends_on:
      - api
      - notifications
      - analytics
    networks:
      - app-network

  # --- СЕРВИС ЗАДАЧ (Java Spring Boot) ---
  api:
    build: .
    environment:
      - DB_HOST=db
      - DB_NAME=app
      - DB_USER=postgres
      - DB_PASSWORD=1234
    depends_on:
      - db
      - redis
    networks:
      - app-network

  # --- СЕРВИС УВЕДОМЛЕНИЙ (Python FastAPI) ---
  notifications:
    build: ./notification-service
    networks:
      - app-network

  # --- СЕРВИС АНАЛИТИКИ (Чистый GoLang) ---
  analytics:
    build: ./analytics-service
    networks:
      - app-network

  # --- БАЗА ДАННЫХ ---
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  # --- КЭШ ---
  redis:
    image: redis:alpine
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
